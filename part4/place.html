<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
    <nav>
        <a href="index.html">
    <img src="images/logo.png" alt="HBnB Logo" class="logo">
</a>
        <a href="login.html" class="login-button">Login</a>
    </nav>
</header>

    <main>
        
             <section id="place-details" class="place-details">
    <h1>Beautiful Beach House</h1>

    <div class="place-info">
        Host: John Doe
Price per night: $100
Description: A beautiful house near the beach.
Amenities: WiFi, 2 Bedrooms, 1 Bathroom
    </div>

    </section>
    
        <section id="reviews">
            <h2>Reviews</h2>

    <div class="review-card">
    <p><strong>User:</strong> Jane Smith</p>
    <p><strong>Comment:</strong> Amazing place!</p>
    <p><strong>Rating:</strong> 5/5</p>
</div>
        </section>
        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
    <p>© 2026 HBnB. All rights reserved.</p>
</footer>

    <script src="scripts.js"></script>
</body>
</html>
