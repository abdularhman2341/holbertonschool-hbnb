<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Available Places</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="brand-link">
                <img
                    src="images/logo.png"
                    alt="HBnB Logo"
                    class="logo"
                >
            </a>

            <a
                href="login.html"
                id="login-link"
                class="login-button"
            >
                Login
            </a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">HBnB</p>
            <h1>Find your next place to stay</h1>
            <p class="hero-text">
                Browse available places and find the stay
                that matches your budget.
            </p>
        </section>

        <section class="places-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Explore</p>
                    <h2>Available Places</h2>
                </div>

                <div id="filter" class="price-filter">
                    <label for="price-filter">Max Price</label>
                    <select id="price-filter">
                        <!-- Options populated by JavaScript -->
                    </select>
                </div>
            </div>

            <p
                id="places-message"
                class="status-message"
                aria-live="polite"
            ></p>

            <section
                id="places-list"
                class="places-grid"
                aria-label="Available places"
            >
                <!-- Places populated dynamically -->
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
